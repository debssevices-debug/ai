[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nec-ai"
version = "0.2.0"
description = "NEC AI: a personal agent that plans, searches the web and uses tools, by text or voice"
requires-python = ">=3.11, <3.15"

dependencies = [
    # Powers search_web directly; no wrapper library on top of it.
    "ddgs>=9.16.0",
    # mcp is the optional extra that powers the Playwright escape hatch.
    "livekit-agents[google,images,mcp]~=1.8",
    "livekit-plugins-ai-coustics~=0.3",
    "playwright~=1.56",
    "python-dotenv",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "google-genai>=1.30",
    "openai>=1.40",
    "anthropic>=1.0",
]

[project.scripts]
nec = "nec_ai.cli:main"


[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
include = ["nec_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
